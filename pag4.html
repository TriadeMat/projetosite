<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="../projetosite/css/pag4.css">
</head>
<body>

    <header>
        <h1>Carrinho de Compras</h1>
     <a href="pag1.html" class="home-btn">
     <button class="home-btn">
  <img src="../Projeto02/img/lar.png" alt="Home" class="icon">
</button>
</a>
<a href="pag4.html" class="icon">
<button class="compra-btn">
    <img src="../Projeto02/img/carrinho-de-compras.png" alt="Compra" class="icon">

</button>
</a>
     <a href="pag2.html" class="btn1">Refeições</a>
     <a href="pag3.html" class="btn2">Sobremesas</a>
     <a href="pag5.html" class="btn-login">Login</a>   
    </header>

    <main class="container">
        <div class="cart-item">
            <img src="../Projeto02/img/img11.png" alt="Produto 1">
            <div class="item-info">
                <h2>Produto 1</h2>
                <p>R$ 30,00</p>
            </div>
            <div class="item-actions">
                <input type="number" min="1" value="1">
                <button class="remove">Remover</button>
            </div>
        </div>

        <div class="cart-item">
            <img src="../Projeto02/img/img5.png" alt="Produto 2">
            <div class="item-info">
                <h2>Produto 2</h2>
                <p>R$ 8,00</p>
            </div>
            <div class="item-actions">
                <input type="number" min="1" value="1">
                <button class="remove">Remover</button>
            </div>
        </div>

        <div class="cart-summary">
            <h3>Total: R$ 38,00</h3>
            <button class="checkout">Finalizar Compra</button>
        </div>
    </main>

</body>
</html>
